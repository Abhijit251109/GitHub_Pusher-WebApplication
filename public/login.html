<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' https://github.com">
<link rel="stylesheet" href="login.css">
<title>GitHub Project Pusher — Login</title>
</head>
<body>
<main>
  <h1>GitHub Project Pusher</h1>
  <p id="status" class="muted">Preparing secure GitHub login…</p>
  <div id="setup" class="hidden">
    <p class="muted">GitHub Pages hosts the frontend separately from the free backend. Enter your backend URL once.</p>
    <input id="appUrl" class="url" placeholder="https://your-app.onrender.com" autocomplete="url">
    <div class="row">
      <button id="go">Continue with GitHub</button>
      <button id="local" class="secondary">Use local server</button>
    </div>
    <p class="hint muted">Local server default: http://127.0.0.1:4173</p>
    <p id="error" class="error"></p>
  </div>
</main>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
