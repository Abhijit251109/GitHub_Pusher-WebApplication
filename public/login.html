<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.auth0.com; style-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.onrender.com https://*.auth0.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; frame-src 'self' https://*.auth0.com">
<link rel="stylesheet" href="login.css">
<title>GitHub Project Pusher — Login</title>
</head>
<body>
<main>
  <h1>GitHub Project Pusher</h1>
  <p id="status" class="muted">Preparing secure Auth0 login…</p>
  <div class="row">
    <button id="login" class="primary" hidden>Continue with Auth0</button>
  </div>
  <p class="hint muted">Auth0 will show the enabled sign-in options, including Google and Username-Password-Authentication.</p>
  <p id="error" class="error"></p>
</main>
<script src="config.js"></script>
<script src="auth0-client.js"></script>
<script src="login.js"></script>
</body>
</html>
