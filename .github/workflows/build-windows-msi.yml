name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build MSI
        run: npm run build:windows-installer -- --x64

      - name: Upload github_pusher.msi
        uses: actions/upload-artifact@v4
        with:
          name: github_pusher-windows-msi
          path: dist/github_pusher.msi
          if-no-files-found: error
