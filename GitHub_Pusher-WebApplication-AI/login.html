<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>GitHub Pusher Studio — Login</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1020;
    --bg-glow: #1a1640;
    --panel: rgba(20, 28, 48, .92);
    --panel-solid: #141c30;
    --panel-raised: #19243b;
    --field: #0e1628;
    --text: #eef2ff;
    --muted: #9aa8c0;
    --line: #2b3955;
    --line-strong: #3a4b6c;
    --accent: #a78bfa;
    --accent-strong: #8b5cf6;
    --accent-soft: rgba(139, 92, 246, .16);
    --danger: #fb7185;
    --danger-soft: rgba(251, 113, 133, .12);
    --shadow: 0 24px 70px rgba(0, 0, 0, .35);
    --radius: 22px;
    --radius-xs: 10px;
    --transition: .2s cubic-bezier(.4, 0, .2, 1);
    --transition-spring: .35s cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    color: var(--text);
    background:
      radial-gradient(ellipse at 30% 0%, var(--bg-glow) 0%, transparent 30%),
      radial-gradient(ellipse at 80% 100%, color-mix(in srgb, var(--accent-soft) 50%, transparent) 0%, transparent 25%),
      var(--bg);
    padding: 20px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    width: min(92vw, 540px);
    padding: clamp(28px, 5vw, 48px);
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: var(--radius);
    background:
      radial-gradient(ellipse at 100% 0%, var(--accent-soft), transparent 50%),
      var(--panel);
    box-shadow: var(--shadow);
    animation: fadeUp .5s cubic-bezier(.4, 0, .2, 1) both;
    position: relative;
    overflow: hidden;
  }
  main::after {
    content: '';
    position: absolute;
    top: -30%;
    right: -20%;
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: glow 5s ease-in-out infinite alternate;
  }
  @keyframes glow {
    0% { transform: translate(0, 0) scale(1); opacity: .3; }
    100% { transform: translate(-20px, 20px) scale(1.15); opacity: .6; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px) scale(.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 4vw, 32px);
    line-height: 1.15;
    letter-spacing: -.04em;
    position: relative;
    z-index: 1;
  }
  h1::before {
    content: '⌁';
    display: inline-block;
    width: 40px;
    height: 40px;
    place-items: center;
    text-align: center;
    line-height: 40px;
    margin-right: 10px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 22px;
    vertical-align: middle;
  }
  .muted { color: var(--muted); position: relative; z-index: 1; }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; position: relative; z-index: 1; }
  input, button, a { font: inherit; }
  .url {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--line-strong);
    background: var(--field);
    color: var(--text);
    outline: none;
    margin-top: 16px;
    transition: border-color var(--transition), box-shadow var(--transition);
    position: relative;
    z-index: 1;
  }
  .url::placeholder { color: color-mix(in srgb, var(--muted) 65%, transparent); }
  .url:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), 0 0 20px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  button, a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 20px;
    border: 1px solid transparent;
    border-radius: var(--radius-xs);
    text-decoration: none;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    transition: transform var(--transition-spring), background-color var(--transition), border-color var(--transition), box-shadow var(--transition);
    position: relative;
    z-index: 1;
    overflow: hidden;
  }
  button {
    border-color: color-mix(in srgb, var(--accent-strong) 75%, white);
    background: linear-gradient(135deg, var(--accent-strong), #9b68f2);
    color: #fff;
    box-shadow: 0 7px 20px rgba(124, 58, 237, .22), inset 0 1px 0 rgba(255,255,255,.1);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(124, 58, 237, .35), inset 0 1px 0 rgba(255,255,255,.15);
  }
  button:active { transform: translateY(0) scale(.98); }
  .secondary {
    border-color: var(--line-strong);
    background: var(--panel-raised);
    color: var(--text);
  }
  .secondary:hover {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
  }
  .error {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid color-mix(in srgb, var(--danger) 28%, var(--line));
    border-radius: var(--radius-xs);
    background: color-mix(in srgb, var(--danger) 10%, var(--panel-solid));
    color: var(--danger);
    font-size: 13px;
    display: none;
    position: relative;
    z-index: 1;
  }
  .error::before { content: '⚠ '; }
  .hint { font-size: 13px; margin-top: 12px; position: relative; z-index: 1; }
  .hidden { display: none; }
  #setup p.muted { margin-top: 0; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 480px) {
    main { padding: 24px 20px; }
    h1 { font-size: 22px; }
    .row { flex-direction: column; }
    .row button { width: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>GitHub Pusher Studio</h1>
  <p id="status" class="muted">Opening GitHub login…</p>
  <div id="setup" class="hidden">
    <p class="muted">This file is being opened directly. Enter the URL where your GitHub Pusher Studio server is running.</p>
    <input id="appUrl" class="url" placeholder="https://your-domain.example" autocomplete="url">
    <div class="row">
      <button id="go">Open GitHub login</button>
      <button id="local" class="secondary">Use local server</button>
    </div>
    <p class="hint muted">Local server default: http://127.0.0.1:4173</p>
    <p id="error" class="error"></p>
  </div>
</main>
<script>
(() => {
  const trimBase = value => String(value || '').trim().replace(/\/+$/, '');
  const status = document.getElementById('status');
  const setup = document.getElementById('setup');
  const input = document.getElementById('appUrl');
  const error = document.getElementById('error');

  function go(base) {
    base = trimBase(base);
    if (!/^https?:\/\//i.test(base)) {
      error.textContent = 'Please enter a full URL starting with http:// or https://';
      error.style.display = 'block';
      return;
    }
    localStorage.setItem('gpp_app_url', base);
    window.location.href = base + '/login';
  }

  // When hosted by the app, the same-origin /login route is the correct target.
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    window.location.replace('/login');
    return;
  }

  // Standalone file: use a previously saved server URL, otherwise ask once.
  const saved = localStorage.getItem('gpp_app_url');
  if (saved) {
    status.textContent = 'Opening your GitHub Pusher Studio server…';
    go(saved);
    return;
  }

  status.textContent = 'Server address required';
  setup.classList.remove('hidden');
  document.getElementById('go').onclick = () => go(input.value);
  document.getElementById('local').onclick = () => go('http://127.0.0.1:4173');
})();
</script>
</body>
</html>
